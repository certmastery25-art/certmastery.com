# Render Blueprint for CertMastery: a Node.js web service running `next start`.
# Secrets marked `sync: false` are entered in the Render dashboard and never committed.
services:
  - type: web
    name: certmastery
    runtime: node
    plan: free
    branch: azure
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/auth/csrf
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      # The service's own address, for example https://certmastery.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      # Needed for the contact form; without them the form says email isn't configured.
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
